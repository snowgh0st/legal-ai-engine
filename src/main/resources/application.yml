spring:
  application:
    name: legal-graph-rag
  
  # Spring Boot Admin Client Self-Registration Configuration
  boot:
    admin:
      client:
        url: http://localhost:8080

  # PostgreSQL JPA Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/legal_audit_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Neo4j Graph Database Configuration
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Actuator Metrics & Health Exposure for Dashboard
management:
  endpoints:
    web:
      exposure:
        include: "*" # Expose all endpoints (health, info, metrics, env, loggers, heapdump)
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    neo4j:
      enabled: true

server:
  port: 8080