spring:
  application:
    name: legal-graph-rag

  # Spring Boot Admin Context Path
  boot:
    admin:
      context-path: /admin
      client:
        url: http://localhost:8080/admin

  # Spring Data REST Configuration
  data:
    rest:
      base-path: /api/v1/data
      default-media-type: application/hal+json

  # Databases & AI Configurations
  datasource:
    url: jdbc:postgresql://localhost:5432/legal_audit_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8080