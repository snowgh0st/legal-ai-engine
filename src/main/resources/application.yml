spring:
  application:
    name: legal-graph-rag
  
  # PostgreSQL JPA Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/legal_audit_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Neo4j Graph Database Configuration
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password123

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.1 # Low temperature for accurate legal extraction

  # Multipart File Upload Limits (For Large Legal PDF Contracts)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080