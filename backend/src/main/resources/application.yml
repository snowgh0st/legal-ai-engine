spring:
  application:
    name: lexintel

  # Spring Boot Admin Context & Server Setup
  boot:
    admin:
      context-path: /admin
      client:
        # Disable auto-registration in production, or override via env var
        enabled: ${SPRING_BOOT_ADMIN_CLIENT_ENABLED:false}
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL:http://localhost:8080}
        instance:
          service-base-url: ${SPRING_BOOT_ADMIN_CLIENT_SERVICE_URL:http://localhost:8080}
          management-url: ${SPRING_BOOT_ADMIN_CLIENT_MANAGEMENT_URL:http://localhost:8080/actuator}
          health-url: ${SPRING_BOOT_ADMIN_CLIENT_HEALTH_URL:http://localhost:8080/actuator/health}
  
  # Spring Configuration Import from .env or .properties
  config:
    import: 
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  # Spring Data Configuration
  data:
    rest:
      base-path: /api/v1/data
      default-media-type: application/hal+json

  # Relational Database (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Graph Database (Neo4j Connection)
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_USERNAME:neo4j}
      password: ${SPRING_NEO4J_PASSWORD}

  # Spring AI (OpenAI Integration)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

  # Multipart Upload Configuration (PDF Handling)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Spring Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clerk automatically publishes JWKS at <issuer-uri>/.well-known/jwks.json
          issuer-uri: https://smooth-unicorn-1717.clerk.accounts.dev

# Springdoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  paths-to-exclude:
    - /admin/**

# Spring Boot Actuator Monitoring Endpoints
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# SEC EDGAR API Configuration
sec:
  edgar:
    user-agent: "LexIntel-RagSearch admin@lexintel.io" # Required by SEC EDGAR API
    base-url: "https://data.sec.gov"
    archives-url: "https://www.sec.gov/Archives"

# Slack Webhook Configuration
slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/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}

# Logging Levels
logging:
  level:
    org.springframework.data.neo4j.cypher.deprecation: ERROR
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.client: TRACE
    org.springframework.data.neo4j: DEBUG
    org.apache.hc.client5.http.wire: DEBUG
    org.apache.hc.client5.http.headers: DEBUG

# Server Port
server:
  port: 8080
