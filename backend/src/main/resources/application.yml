spring:
  application:
    name: legal-graph-rag

  # Spring Boot Admin Context & Server Setup
  boot:
    admin:
      context-path: /admin
      client:
        url: http://localhost:8080/admin
  
  # Spring Configuration Import from .env or .properties
  config:
    import: 
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  # Spring Data REST Configuration
  data:
    rest:
      base-path: /api/v1/data
      default-media-type: application/hal+json

  # Relational Database (PostgreSQL)
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/legal_audit_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Graph Database (Neo4j)
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}

  # Spring AI (OpenAI Integration)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small

  # Multipart Upload Configuration (PDF Handling)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Springdoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  paths-to-exclude:
    - /admin/**

# Spring Boot Actuator Monitoring Endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging Levels
logging:
  level:
    org.springframework.data.neo4j.cypher.deprecation: ERROR
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.client: TRACE
    org.springframework.data.neo4j: DEBUG
    org.apache.hc.client5.http.wire: DEBUG
    org.apache.hc.client5.http.headers: DEBUG

# Server Port
server:
  port: 8080