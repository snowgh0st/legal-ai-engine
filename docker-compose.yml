services:
  # ---------------------------------------------------------------------------
  # Database Infrastructure
  # ---------------------------------------------------------------------------
  lexintel-graphdb:
    image: neo4j:5.18.0-enterprise
    container_name: lexintel-graphdb
    env_file:
      - ./backend/.env
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - lexintel-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  lexintel-postgres:
    image: postgres:16-alpine
    container_name: lexintel-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-lexintel_audit_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lexintel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lexintel_audit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  lexintel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexintel-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
      - "5005:5005" # Remote Debugging Port
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_DATASOURCE_URL=jdbc:postgresql://lexintel-postgres:5432/${POSTGRES_DB:-lexintel_audit_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_NEO4J_URI=bolt://lexintel-graphdb:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=${NEO4J_USER:-neo4j}
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/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
    depends_on:
      lexintel-postgres:
        condition: service_healthy
      lexintel-graphdb:
        condition: service_healthy
    networks:
      - lexintel-network

  lexintel-frontend:
    profiles:
      - frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lexintel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - lexintel-backend
    networks:
      - lexintel-network

networks:
  lexintel-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: