services:
  legal-graphdb:
    image: neo4j:5.18.0-enterprise
    container_name: legal-graphdb
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  legal-postgres:
    image: postgres:16-alpine
    container_name: legal-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=legal_audit_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: