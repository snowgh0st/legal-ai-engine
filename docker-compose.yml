version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Infrastructure
  # ---------------------------------------------------------------------------
  legal-graphdb:
    image: neo4j:5.18.0-enterprise
    container_name: legal-graphdb
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  legal-postgres:
    image: postgres:16-alpine
    container_name: legal-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=legal_audit_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  legal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://legal-postgres:5432/legal_audit_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password123
      - SPRING_NEO4J_URI=bolt://legal-graphdb:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      legal-postgres:
        condition: service_healthy
      legal-graphdb:
        condition: service_healthy
    networks:
      - legal-network

  legal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - legal-backend
    networks:
      - legal-network

# ---------------------------------------------------------------------------
# Networks & Volumes
# ---------------------------------------------------------------------------
networks:
  legal-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: