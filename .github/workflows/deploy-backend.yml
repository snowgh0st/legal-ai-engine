name: Deploy LexIntel Backend to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Build & Deploy Spring Boot
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Authenticate to Google Cloud via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_APP_DEPLOYER_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build & Push Docker Image
        env:
          IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lexintel-repo/lexintel-backend:${{ github.sha }}
        run: |
          # Pass 'backend' as the context path where Dockerfile lives
          docker build -t $IMAGE_TAG ./backend
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lexintel-backend
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lexintel-repo/lexintel-backend:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            CLERK_ISSUER_URI=${{ secrets.CLERK_ISSUER_URI }}
            SPRING_DATASOURCE_URL=jdbc:postgresql:///audit_db?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:lexintel-postgres-instance
            SPRING_NEO4J_URI=bolt://10.0.1.5:7687
          secrets: |
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            SPRING_AI_OPENAI_API_KEY=OPENAI_API_KEY:latest
            SPRING_DATASOURCE_PASSWORD=AUDIT_DB_PASSWORD:latest
            SPRING_NEO4J_PASSWORD=NEO4J_PASSWORD:latest
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --vpc-connector=lexintel-vpc-connector
            --vpc-egress=private-ranges-only
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:lexintel-postgres-instance